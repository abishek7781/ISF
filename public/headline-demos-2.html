<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hero headline demos 2</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@300;500;700;800;900&family=Bebas+Neue&family=Caveat:wght@600;700&family=Fraunces:ital,opsz,wght@0,9..144,700;1,9..144,600&family=Inter:wght@400;500&family=Oswald:wght@500;700&family=Permanent+Marker&family=Staatliches&family=Black+Ops+One&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:#0d0f12;color:#fff;padding:22px;max-width:1100px;margin:auto}
h1{font-size:1.3rem;margin-bottom:4px}.s{color:#aab;font-size:.88rem;margin-bottom:22px;max-width:95ch}
.c{margin-bottom:22px}.c>small{display:block;color:#9ad79e;font-weight:700;font-size:.86rem;margin-bottom:6px}
.st{position:relative;min-height:310px;border-radius:12px;overflow:hidden;padding:44px 34px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(90deg,rgba(10,14,22,.9) 28%,rgba(10,14,22,.3)),url(/assets/entry-badminton.jpeg) center/cover}
.kick{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:#cdd3dc;margin-bottom:12px}
h2{font:800 3rem/1.04 Archivo,sans-serif;letter-spacing:-.035em;max-width:15ch;color:#fff;position:relative}
p{margin-top:14px;max-width:50ch;font-size:.92rem;line-height:1.55;color:#d7dce4}
em{font-style:normal}
/* 1 condensed caps */
.v1 h2{font:400 4.2rem/.95 "Bebas Neue",sans-serif;letter-spacing:.01em;max-width:12ch}.v1 em{color:#e0ac66}
/* 2 anton heavy */
.v2 h2{font:400 3.4rem/1 Anton,sans-serif;text-transform:uppercase;letter-spacing:.005em;max-width:13ch}.v2 em{background:#fff;color:#111;padding:0 .12em}
/* 3 stencil */
.v3 h2{font:400 3rem/1.1 "Black Ops One",sans-serif;letter-spacing:.02em;max-width:14ch}.v3 em{color:#e8c25a}
/* 4 scoreboard */
.v4 h2{font:400 3rem/1.12 Staatliches,sans-serif;letter-spacing:.06em;max-width:15ch;text-transform:uppercase}.v4 em{background:#ffbf3c;color:#1a1100;padding:.02em .3em;display:inline-block}
/* 5 handwritten note above */
.v5 em{position:relative}.v5 em::before{content:"made to last";position:absolute;left:0;top:-1.2em;font:700 1.5rem Caveat,cursive;color:#f0c27a;transform:rotate(-3deg);white-space:nowrap;letter-spacing:0}
.v5 h2{margin-top:26px}
/* 6 permanent marker circle */
.v6 em{position:relative;padding:0 .1em}.v6 em::after{content:"";position:absolute;inset:-.12em -.18em;border:3px solid #f0c27a;border-radius:50% 46% 52% 48%/55% 50% 48% 52%;transform:rotate(-1.5deg);pointer-events:none}
/* 7 wood grain letters */
.v7 em{background:repeating-linear-gradient(90deg,#f0c585 0 7px,#d9a35e 7px 8px,#e9b878 8px 15px);-webkit-background-clip:text;background-clip:text;color:transparent}
/* 8 court blue letters */
.v8 em{color:#6fa0ff;position:relative}.v8 em::after{content:"";position:absolute;left:0;right:0;bottom:-.1em;height:3px;background:#fff}
/* 9 strike and replace */
.v9 em{position:relative}.v9 .old{position:relative;color:#9aa1ad;margin-right:.2em;white-space:nowrap}.v9 .old::after{content:"";position:absolute;left:-2%;right:-2%;top:54%;height:4px;background:#e0ac66;transform:rotate(-2deg)}
/* 10 label sticker */
.v10 em{display:inline-block;background:#f4efe2;color:#161616;padding:.04em .3em;transform:rotate(-2deg);box-shadow:0 6px 0 rgba(0,0,0,.35);font-family:Fraunces,serif;font-weight:700;font-style:italic}
/* 11 stamp */
.v11 em{display:inline-block;color:#ff7a59;border:4px solid #ff7a59;padding:0 .2em;transform:rotate(-3deg);letter-spacing:.01em;opacity:.95}
/* 12 blueprint dimension */
.v12 em{position:relative;display:inline-block;padding-bottom:.4em}.v12 em::after{content:"";position:absolute;left:0;right:0;bottom:0;height:12px;border-left:2px solid #8fb5ff;border-right:2px solid #8fb5ff;background:linear-gradient(#8fb5ff,#8fb5ff) 0 50%/100% 2px no-repeat}
/* 13 court corner brackets */
.v13 em{position:relative;padding:.04em .3em}.v13 em::before,.v13 em::after{content:"";position:absolute;width:.5em;height:.5em;border:3px solid #fff}.v13 em::before{left:0;top:0;border-right:0;border-bottom:0}.v13 em::after{right:0;bottom:0;border-left:0;border-top:0}
/* 14 split colour halves */
.v14 em{background:linear-gradient(#fff 50%,#e0ac66 50%);-webkit-background-clip:text;background-clip:text;color:transparent}
/* 15 serif roman big */
.v15 h2{font:700 3.2rem/1.02 Fraunces,Georgia,serif;letter-spacing:-.02em}.v15 em{font-style:italic;font-weight:600}
/* 16 offset shadow */
.v16 em{color:#fff;text-shadow:3px 3px 0 #2f7f35,6px 6px 0 rgba(0,0,0,.35)}
/* 17 tape */
.v17 em{position:relative;z-index:0;padding:0 .16em}.v17 em::before{content:"";position:absolute;inset:.08em -.04em .02em;background:#f1c94a;transform:rotate(-1.2deg);z-index:-1}.v17 em{color:#17140a}
/* 18 line numbers: court markings behind */
.v18 h2::before{content:"";position:absolute;left:-14px;right:-30px;top:-14px;bottom:-14px;border:2px solid rgba(255,255,255,.35);background:linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,.35)) 50% 0/2px 100% no-repeat,linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,.35)) 0 50%/100% 2px no-repeat;pointer-events:none}.v18 h2{padding:8px 4px}
/* 19 mono kicker and plain */
.v19 h2{font:800 3rem/1.04 Archivo,sans-serif}.v19 em{font-family:"Courier New",monospace;font-weight:700;letter-spacing:-.04em;background:rgba(255,255,255,.14);padding:0 .12em;border-radius:4px}
/* 20 gradient dim (no glow) */
.v20 em{color:#fff;border-bottom:.12em solid #3F9E45;padding-bottom:.02em}
/* 21 oswald uppercase with slash */
.v21 h2{font:700 3rem/1.08 Oswald,sans-serif;text-transform:uppercase;letter-spacing:.01em;max-width:14ch}.v21 em{color:#e0ac66}.v21 em::before{content:"/ ";color:#fff;opacity:.5}
/* 22 big quote marks style */
.v22 h2{font:700 3.1rem/1.04 Fraunces,serif;max-width:14ch}.v22 h2::before{content:"\201C";position:absolute;left:-.55em;top:-.1em;font-size:3.6em;color:#e0ac66;line-height:1;opacity:.9}.v22 em{font-style:italic;color:#f0d9b0}
/* 23 progressive weight */
.v23 h2 em{font-weight:900;letter-spacing:-.05em;font-size:1.12em}
/* 24 lowercase calm */
.v24 h2{font:500 3rem/1.12 Archivo,sans-serif;letter-spacing:-.025em}.v24 em{font-weight:800;color:#f0d9b0}
</style></head><body>
<h1>Hero headline: 24 more ways</h1>
<p class="s">A second set, more distinctive: typefaces from sport and print, hand-lettering, a wood-grain fill, stamps, tape, court markings and more. Same line, no glow or gradient halo. Tell me the number you like.</p>
<div id="g"></div>
<script>
const T=['Tall condensed capitals','Heavy poster type with a white block','Stencil lettering','Scoreboard style','A handwritten note above the key words','A hand-drawn circle round the key words','Letters filled with wood grain','Court-blue letters with a white line','Strike out "good", write "great"','Paper label sticker','Rubber stamp','Blueprint dimension line','Court-line corner brackets','Top half white, bottom half maple','Serif headline, italic accent','Offset hard shadow','Masking tape strip','Court markings drawn around the headline','Typewriter accent','Plain white with a green underline','Slash and uppercase','Opening quote mark','Heavier and larger accent words','Calm medium weight with a bold accent']
const body=i=>{const a='Get your players a ',b='great sports arena';if(i===8)return `Get your players a <span class="old">good</span><em>great sports arena</em>.`;return `${a}<em>${b}</em>.`}
document.getElementById('g').innerHTML=T.map((n,i)=>`<div class="c"><small>${i+1}. ${n}</small><div class="st v${i+1}"><div class="kick">Sports infrastructure, Chennai, since 2017</div><h2>${body(i)}</h2><p>Turnkey courts, turfs, tracks and training halls, built to global federation standards.</p></div></div>`).join('')
</script></body></html>
