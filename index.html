<html lang="en">
  <head>
    <meta charset="UTF-8" />

      try{var t=localStorage.getItem('isf-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme='light'}

    <div id="root"><div id="boot"></div></div>
